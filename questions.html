<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test 1</title>
  <link rel="stylesheet" href="https://unpkg.com/normalize.css/normalize.css">
  <style type="text/css">
    body {
      font-family: monospace;
      padding: 20px;
      font-size: 2em;
    }
  </style>
  <script src="https://unpkg.com/vue@3.4.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
  <div id="app" class="space-y-6 min-h-screen flex flex-col justify-center items-center">
    <h3 class="font-bold text-xl">
      {{areWeDone ? `Your score: ${score}/ ${questions}`: 'Answer the following math question!'}}
    </h3>
    <h1 class="text-3xl font-semibold">
      {{question}}
    </h1>
    <div v-if="!areWeDone">
      <input v-model="answer" class="rounded-sm border-2"/>
      <h3> User answer: {{answer}}</h3> 
    </div>
      
  </div>
  <script>
    const { createApp, ref, computed } = Vue;
    const App = {
      setup() {
        const QUESTIONS = [
          'How much is 2+2 ?',
          'How much is 3*5+1 ?',
          'What is the rest from 3/1 ?'
        ];
        const ANSWERS = [
          '4',
          '16',
          '1'
        ];
        const score = ref(0);
        const current = ref(0);
        const answer = ref(null);
        const question = computed(
          () => QUESTIONS[current.value]
        );
        const rightAnswer = computed(
          () => ANSWERS[current.value]
        );
        const areWeDone = computed(
          () => QUESTIONS.length === current.value
        );

        const check = () => {
          console.log('Check!');
          if (answer.value === rightAnswer.value) {
            score.value++;
          }

          answer.value = null; 
          current.value++;
          if (areWeDone.value) {
            clearInterval(interval);
          }
        }
        const interval = setInterval(check, 4000);
        return {
          question, answer, areWeDone, score, questions: QUESTIONS.length
        }
      },
    };
    createApp(App).mount('#app');
  </script>
</body>

</html>
